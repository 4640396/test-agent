server:
  port: ${TEST_AGENT_SERVER_PORT:8088}
  address: ${TEST_AGENT_SERVER_HOST:127.0.0.1}
spring:
  application:
    name: cimdev-test-agent-server
  datasource:
    url: ${TEST_AGENT_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/cimdev_test_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${TEST_AGENT_MYSQL_USER:root}
    password: ${TEST_AGENT_MYSQL_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,runtimeReadiness,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      export:
        enabled: ${TEST_AGENT_OTLP_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
test-agent:
  storage-root: ${TEST_AGENT_STORAGE_ROOT:./data}
  api-token: ${TEST_AGENT_API_TOKEN:}
  role-tokens: ${TEST_AGENT_ROLE_TOKENS:}
  task-lease-seconds: ${TEST_AGENT_TASK_LEASE_SECONDS:60}
  scheduler-delay-ms: ${TEST_AGENT_SCHEDULER_DELAY_MS:30000}
